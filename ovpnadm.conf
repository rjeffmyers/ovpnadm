# ovpnadm settings. Empty values are detected automatically.
# Apply changes with: sudo ovpnadm install   (or the menu: Install / apply settings)

# Internet-side interface and the address clients connect to
EXT_IF=
PUBLIC_IP=

# Network VPN clients are routed to, and the pool their addresses come from
LAN_NET=
VPN_POOL=10.8.0.0/24
PORT=1194

# Linux group whose members may log in
VPN_GROUP=vpnusers

# yes: every person gets their own .ovpn with a certificate that expires after
#      CERT_DAYS days and can be revoked on its own (ovpnadm client add)
# no:  everyone shares one .ovpn (ovpnadm profile); retire it with rotate-key
CLIENT_CERTS=yes
CERT_DAYS=90

# Name of the shared profile file (default: <hostname>-vpn)
PROFILE_NAME=

# Self-service web page for connected users: download their profile, renew it
# (within RENEW_WINDOW days of expiry, never past their access-until date) and
# change their password. It listens only on the VPN server's tunnel address
# (first address of VPN_POOL), so it is never reachable from outside the VPN.
PORTAL=no
PORTAL_PORT=8080
RENEW_WINDOW=14

# Accounts several people share (comma separated): no self-service password change
SHARED_USERS=
